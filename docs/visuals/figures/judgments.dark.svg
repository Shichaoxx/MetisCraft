<svg xmlns="http://www.w3.org/2000/svg" width="950" height="433" viewBox="0 0 950 433" role="img" aria-labelledby="title"><title id="title">Four types of judgment</title><style>text {font-family: "Inter", "DejaVu Sans", Arial, sans-serif}</style><rect width="950" height="433" rx="18" fill="#1C1C1A"/><style>text.heading {font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif} text.kind {font-family: ui-monospace, "SFMono-Regular", Consolas, monospace}</style><text x="22" y="40" font-size="28" fill="#FAF9F5" font-weight="500" class="heading">Four types of judgment</text><text x="24" y="84" font-size="16" fill="#BCB9AE" font-weight="600" >Type</text><text x="262" y="84" font-size="16" fill="#BCB9AE" font-weight="600" >Question</text><text x="595" y="84" font-size="16" fill="#BCB9AE" font-weight="600" >Example output</text><path d="M22 99 H928" stroke="#655F54"/><text x="24" y="128" font-size="20" fill="#FAF9F5" font-weight="600" >Yes / no</text><text x="24" y="153" font-size="15" fill="#ECA388" font-weight="400" text-anchor="start" class="kind">noul</text><text x="262" y="140" font-size="17" fill="#BCB9AE" font-weight="400" >Does this need a human?</text><text x="595" y="140" font-size="18" fill="#9BC1DF" font-weight="550" >P(yes) = 0.85</text><path d="M22 171 H928" stroke="#655F54"/><text x="24" y="200" font-size="20" fill="#FAF9F5" font-weight="600" >Choice</text><text x="24" y="225" font-size="15" fill="#ECA388" font-weight="400" text-anchor="start" class="kind">choice</text><text x="262" y="212" font-size="17" fill="#BCB9AE" font-weight="400" >Which team should handle it?</text><text x="595" y="212" font-size="18" fill="#9BC1DF" font-weight="550" >billing 0.70 · support 0.30</text><path d="M22 243 H928" stroke="#655F54"/><text x="24" y="272" font-size="20" fill="#FAF9F5" font-weight="600" >Ordered score</text><text x="24" y="297" font-size="15" fill="#ECA388" font-weight="400" text-anchor="start" class="kind">score</text><text x="262" y="284" font-size="17" fill="#BCB9AE" font-weight="400" >How urgent is this request?</text><text x="595" y="284" font-size="18" fill="#9BC1DF" font-weight="550" >P(level 1), …, P(level 5)</text><path d="M22 315 H928" stroke="#655F54"/><text x="24" y="344" font-size="20" fill="#FAF9F5" font-weight="600" >Multiple labels</text><text x="24" y="369" font-size="15" fill="#ECA388" font-weight="400" text-anchor="start" class="kind">multi_label</text><text x="262" y="356" font-size="17" fill="#BCB9AE" font-weight="400" >Which topics are present?</text><text x="595" y="356" font-size="18" fill="#9BC1DF" font-weight="550" >P(payments), P(cards), …</text><text x="24" y="413" font-size="16" fill="#BCB9AE" font-weight="400" >Illustrative probabilities for each type.</text></svg>
