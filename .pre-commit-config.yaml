repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check
        language: system
        types: [python]
      - id: example-contracts
        name: Bilingual example contracts
        entry: python scripts/check_examples.py
        language: system
        pass_filenames: false
        files: '^(README|docs/|src/metiscraft/templates/)'
