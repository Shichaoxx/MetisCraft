name: Bug report
description: Report a reproducible problem with MetisCraft.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, a small recipe and synthetic records. Remove private data and credentials.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and versions
      description: Include MetisCraft, Python, PyTorch, Transformers, OS and hardware versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
