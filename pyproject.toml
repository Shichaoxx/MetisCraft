[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "metiscraft"
version = "0.1.0rc1"
description = "Train Jev-style System One decision models: typed judgments with calibrated probabilities in one forward pass."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "shichao" }]
keywords = ["decision model", "calibration", "llm", "classification", "judge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "transformers>=4.56",
  "peft>=0.13",
  "accelerate>=1.0",
  "huggingface_hub>=0.25",
  "safetensors>=0.4",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pyarrow>=14",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
# rebuilding data with a project's own builders (metiscraft data prepare tev1)
reproduce = ["datasets>=4.0", "jinja2>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "scikit-learn>=1.4", "httpx>=0.27"]

[project.scripts]
metiscraft = "metiscraft.cli:main"

[project.urls]
Repository = "https://github.com/Shichaoxx/MetisCraft"
Documentation = "https://shichaoxx.github.io/MetisCraft/en/"
Issues = "https://github.com/Shichaoxx/MetisCraft/issues"
Changelog = "https://github.com/Shichaoxx/MetisCraft/blob/main/CHANGELOG.md"

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/metiscraft"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Only Python sources; Markdown code blocks (e.g. aligned shape comments) stay as written.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Report builders carry HTML, CSS and prose in string literals; wrapping them hurts readability.
"docs/reports/**" = ["E501"]
"docs/cookbook/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
