<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="title"><title id="title">Four judgment types, with illustrative outputs</title><style>text {font-family: "Inter", "DejaVu Sans", Arial, sans-serif}</style><rect width="1200" height="486" rx="18" fill="#18212c"/><text x="32" y="46" font-size="30" fill="#e2eaf3" font-weight="650" >Four ways to ask a decision model</text><rect x="32" y="80" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="54" y="115" font-size="23" fill="#83d8cd" font-weight="650" >Yes / no</text><text x="382" y="114" font-size="15" fill="#acb9c4" font-weight="400" >noul</text><text x="54" y="157" font-size="20" fill="#e2eaf3" font-weight="400" >Does this need a human?</text><text x="54" y="199" font-size="20" fill="#e3c58d" font-weight="500" >P(yes) = 0.85</text><rect x="622" y="80" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="644" y="115" font-size="23" fill="#83d8cd" font-weight="650" >Choice</text><text x="972" y="114" font-size="15" fill="#acb9c4" font-weight="400" >choice</text><text x="644" y="157" font-size="20" fill="#e2eaf3" font-weight="400" >Which team should handle it?</text><text x="644" y="199" font-size="20" fill="#e3c58d" font-weight="500" >billing: 0.70 · support: 0.30</text><rect x="32" y="256" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="54" y="291" font-size="23" fill="#83d8cd" font-weight="650" >Ordered score</text><text x="382" y="290" font-size="15" fill="#acb9c4" font-weight="400" >score</text><text x="54" y="333" font-size="20" fill="#e2eaf3" font-weight="400" >How urgent is this request?</text><text x="54" y="375" font-size="20" fill="#e3c58d" font-weight="500" >P(level 1), …, P(level 5)</text><rect x="622" y="256" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="644" y="291" font-size="23" fill="#83d8cd" font-weight="650" >Multiple labels</text><text x="972" y="290" font-size="15" fill="#acb9c4" font-weight="400" >multi_label</text><text x="644" y="333" font-size="20" fill="#e2eaf3" font-weight="400" >Which topics are present?</text><text x="644" y="375" font-size="20" fill="#e3c58d" font-weight="500" >P(payments), P(cards), …</text><text x="32" y="456" font-size="16" fill="#adbfca" font-weight="400" >Illustrative outputs, not benchmark results. Each type has its own probability semantics.</text></svg>
