<svg xmlns="http://www.w3.org/2000/svg" width="360" height="556" viewBox="0 0 360 556" role="img" aria-labelledby="title"><title id="title">Four types of judgment</title><style>text {font-family: "Inter", "DejaVu Sans", Arial, sans-serif}</style><rect width="360" height="556" rx="18" fill="#FAF9F5"/><style>text.heading {font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif} text.kind {font-family: ui-monospace, "SFMono-Regular", Consolas, monospace}</style><text x="22" y="40" font-size="23" fill="#24231F" font-weight="500" class="heading">Four types of judgment</text><path d="M22 65 H338" stroke="#C4BEB1"/><text x="24" y="94" font-size="20" fill="#24231F" font-weight="600" >Yes / no</text><text x="336" y="93" font-size="15" fill="#924428" font-weight="400" text-anchor="end" class="kind">noul</text><text x="24" y="124" font-size="17" fill="#625F56" font-weight="400" >Does this need a human?</text><text x="24" y="151" font-size="18" fill="#375A75" font-weight="550" >P(yes) = 0.85</text><path d="M22 176 H338" stroke="#C4BEB1"/><text x="24" y="205" font-size="20" fill="#24231F" font-weight="600" >Choice</text><text x="336" y="204" font-size="15" fill="#924428" font-weight="400" text-anchor="end" class="kind">choice</text><text x="24" y="235" font-size="17" fill="#625F56" font-weight="400" >Which team should handle it?</text><text x="24" y="262" font-size="18" fill="#375A75" font-weight="550" >billing 0.70 · support 0.30</text><path d="M22 287 H338" stroke="#C4BEB1"/><text x="24" y="316" font-size="20" fill="#24231F" font-weight="600" >Ordered score</text><text x="336" y="315" font-size="15" fill="#924428" font-weight="400" text-anchor="end" class="kind">score</text><text x="24" y="346" font-size="17" fill="#625F56" font-weight="400" >How urgent is this request?</text><text x="24" y="373" font-size="18" fill="#375A75" font-weight="550" >P(level 1), …, P(level 5)</text><path d="M22 398 H338" stroke="#C4BEB1"/><text x="24" y="427" font-size="20" fill="#24231F" font-weight="600" >Multiple labels</text><text x="336" y="426" font-size="15" fill="#924428" font-weight="400" text-anchor="end" class="kind">multi_label</text><text x="24" y="457" font-size="17" fill="#625F56" font-weight="400" >Which topics are present?</text><text x="24" y="484" font-size="18" fill="#375A75" font-weight="550" >P(payments), P(cards), …</text><text x="24" y="536" font-size="16" fill="#625F56" font-weight="400" >Illustrative probabilities for each type.</text></svg>
