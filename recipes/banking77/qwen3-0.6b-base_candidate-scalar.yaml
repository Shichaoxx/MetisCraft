# Banking77 (77 intents, choice) with the candidate-scalar readout (③, list layout).
# Pairs with banking77/qwen3-0.6b-base_answer-token.yaml: same data/evaluation settings; readout and max_length differ (768 vs 1024).
task: banking77
data: {dataset: banking77}
model:
  base: qwen3/0.6b-base-da87bfb6
  dtype: bf16
  max_length: 768
  finetune: {kind: lora, r: 16, alpha: 32, dropout: 0.05, targets: all-linear}
readout: {kind: candidate_scalar, layout: list, head: {hidden: 256}, shuffle_train: true}
objective: {kind: cross_entropy}
train: {epochs: 2, batch_size: 8, grad_accum: 2, lr: 2.0e-4, head_lr: 1.0e-3, warmup_ratio: 0.03, seed: 42, bf16: true, logging_steps: 20}
calibrate: {method: temperature, split: calib}
eval: {splits: [dev, test], baselines: [prior]}
