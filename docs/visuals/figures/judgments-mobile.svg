<svg xmlns="http://www.w3.org/2000/svg" width="480" height="904" viewBox="0 0 480 904" role="img" aria-labelledby="title"><title id="title">Four judgment types, vertical examples</title><style>text {font-family: "Inter", "DejaVu Sans", Arial, sans-serif}</style><rect width="480" height="904" rx="18" fill="#ffffff"/><text x="28" y="44" font-size="28" fill="#243438" font-weight="650" >Four types of judgment</text><rect x="24" y="76" width="432" height="166" rx="12" fill="#f6faf9" stroke="#d2e3df"/><text x="44" y="112" font-size="25" fill="#087f78" font-weight="650" >Yes / no</text><text x="44" y="141" font-size="17" fill="#6a7577" font-weight="400" >noul</text><text x="44" y="179" font-size="21" fill="#243438" font-weight="400" >Does this need a human?</text><text x="44" y="215" font-size="21" fill="#76571f" font-weight="500" >P(yes) = 0.85</text><rect x="24" y="262" width="432" height="166" rx="12" fill="#f6faf9" stroke="#d2e3df"/><text x="44" y="298" font-size="25" fill="#087f78" font-weight="650" >Choice</text><text x="44" y="327" font-size="17" fill="#6a7577" font-weight="400" >choice</text><text x="44" y="365" font-size="21" fill="#243438" font-weight="400" >Which team should handle it?</text><text x="44" y="401" font-size="21" fill="#76571f" font-weight="500" >billing: 0.70 · support: 0.30</text><rect x="24" y="448" width="432" height="166" rx="12" fill="#f6faf9" stroke="#d2e3df"/><text x="44" y="484" font-size="25" fill="#087f78" font-weight="650" >Ordered score</text><text x="44" y="513" font-size="17" fill="#6a7577" font-weight="400" >score</text><text x="44" y="551" font-size="21" fill="#243438" font-weight="400" >How urgent is this request?</text><text x="44" y="587" font-size="21" fill="#76571f" font-weight="500" >P(level 1), …, P(level 5)</text><rect x="24" y="634" width="432" height="166" rx="12" fill="#f6faf9" stroke="#d2e3df"/><text x="44" y="670" font-size="25" fill="#087f78" font-weight="650" >Multiple labels</text><text x="44" y="699" font-size="17" fill="#6a7577" font-weight="400" >multi_label</text><text x="44" y="737" font-size="21" fill="#243438" font-weight="400" >Which topics are present?</text><text x="44" y="773" font-size="21" fill="#76571f" font-weight="500" >P(payments), P(cards), …</text><text x="28" y="846" font-size="18" fill="#546b6d" font-weight="400" >Illustrative outputs, not benchmark results.</text><text x="28" y="875" font-size="18" fill="#546b6d" font-weight="400" >Probability semantics differ by type.</text></svg>
