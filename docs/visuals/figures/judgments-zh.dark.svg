<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="486" viewBox="0 0 1200 486" role="img" aria-labelledby="title"><title id="title">四种判断类型及构造示例</title><style>text {font-family: "Inter", "Noto Sans CJK SC", "WenQuanYi Zen Hei", Arial, sans-serif}</style><rect width="1200" height="486" rx="18" fill="#18212c"/><text x="32" y="46" font-size="30" fill="#e2eaf3" font-weight="650" >向判断模型提出四类问题</text><rect x="32" y="80" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="54" y="115" font-size="23" fill="#83d8cd" font-weight="650" >是非判断</text><text x="382" y="114" font-size="15" fill="#acb9c4" font-weight="400" >noul</text><text x="54" y="157" font-size="20" fill="#e2eaf3" font-weight="400" >需要人工处理吗？</text><text x="54" y="199" font-size="20" fill="#e3c58d" font-weight="500" >P(是) = 0.85</text><rect x="622" y="80" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="644" y="115" font-size="23" fill="#83d8cd" font-weight="650" >选择判断</text><text x="972" y="114" font-size="15" fill="#acb9c4" font-weight="400" >choice</text><text x="644" y="157" font-size="20" fill="#e2eaf3" font-weight="400" >应该交给哪个团队？</text><text x="644" y="199" font-size="20" fill="#e3c58d" font-weight="500" >账单: 0.70 · 支持: 0.30</text><rect x="32" y="256" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="54" y="291" font-size="23" fill="#83d8cd" font-weight="650" >等级判断</text><text x="382" y="290" font-size="15" fill="#acb9c4" font-weight="400" >score</text><text x="54" y="333" font-size="20" fill="#e2eaf3" font-weight="400" >请求的紧急程度是几级？</text><text x="54" y="375" font-size="20" fill="#e3c58d" font-weight="500" >P(等级 1), …, P(等级 5)</text><rect x="622" y="256" width="558" height="152" rx="12" fill="#22323e" stroke="#4c636b"/><text x="644" y="291" font-size="23" fill="#83d8cd" font-weight="650" >多标签判断</text><text x="972" y="290" font-size="15" fill="#acb9c4" font-weight="400" >multi_label</text><text x="644" y="333" font-size="20" fill="#e2eaf3" font-weight="400" >包含哪些主题？</text><text x="644" y="375" font-size="20" fill="#e3c58d" font-weight="500" >P(支付), P(卡片), …</text><text x="32" y="456" font-size="16" fill="#adbfca" font-weight="400" >构造输出示例，并非评测结果。不同类型采用各自的概率语义。</text></svg>
