<svg xmlns="http://www.w3.org/2000/svg" width="480" height="904" viewBox="0 0 480 904" role="img" aria-labelledby="title"><title id="title">四种判断类型：纵向示例</title><style>text {font-family: "Inter", "Noto Sans CJK SC", "WenQuanYi Zen Hei", Arial, sans-serif}</style><rect width="480" height="904" rx="18" fill="#18212c"/><text x="28" y="44" font-size="28" fill="#e2eaf3" font-weight="650" >四种判断类型</text><rect x="24" y="76" width="432" height="166" rx="12" fill="#22323e" stroke="#4c636b"/><text x="44" y="112" font-size="25" fill="#83d8cd" font-weight="650" >是非判断</text><text x="44" y="141" font-size="17" fill="#acb9c4" font-weight="400" >noul</text><text x="44" y="179" font-size="21" fill="#e2eaf3" font-weight="400" >需要人工处理吗？</text><text x="44" y="215" font-size="21" fill="#e3c58d" font-weight="500" >P(是) = 0.85</text><rect x="24" y="262" width="432" height="166" rx="12" fill="#22323e" stroke="#4c636b"/><text x="44" y="298" font-size="25" fill="#83d8cd" font-weight="650" >选择判断</text><text x="44" y="327" font-size="17" fill="#acb9c4" font-weight="400" >choice</text><text x="44" y="365" font-size="21" fill="#e2eaf3" font-weight="400" >应该交给哪个团队？</text><text x="44" y="401" font-size="21" fill="#e3c58d" font-weight="500" >账单: 0.70 · 支持: 0.30</text><rect x="24" y="448" width="432" height="166" rx="12" fill="#22323e" stroke="#4c636b"/><text x="44" y="484" font-size="25" fill="#83d8cd" font-weight="650" >等级判断</text><text x="44" y="513" font-size="17" fill="#acb9c4" font-weight="400" >score</text><text x="44" y="551" font-size="21" fill="#e2eaf3" font-weight="400" >请求的紧急程度是几级？</text><text x="44" y="587" font-size="21" fill="#e3c58d" font-weight="500" >P(等级 1), …, P(等级 5)</text><rect x="24" y="634" width="432" height="166" rx="12" fill="#22323e" stroke="#4c636b"/><text x="44" y="670" font-size="25" fill="#83d8cd" font-weight="650" >多标签判断</text><text x="44" y="699" font-size="17" fill="#acb9c4" font-weight="400" >multi_label</text><text x="44" y="737" font-size="21" fill="#e2eaf3" font-weight="400" >包含哪些主题？</text><text x="44" y="773" font-size="21" fill="#e3c58d" font-weight="500" >P(支付), P(卡片), …</text><text x="28" y="846" font-size="18" fill="#adbfca" font-weight="400" >构造输出示例，并非评测结果。</text><text x="28" y="875" font-size="18" fill="#adbfca" font-weight="400" >概率语义因类型而异。</text></svg>
