<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="276" viewBox="0 0 1200 276" role="img" aria-labelledby="title"><title id="title">Data, training, calibration, evaluation and serving</title><style>text {font-family: "Inter", "DejaVu Sans", Arial, sans-serif}</style><rect width="1200" height="276" rx="18" fill="#18212c"/><text x="32" y="46" font-size="30" fill="#e2eaf3" font-weight="650" >One recipe, from data to decisions</text><rect x="32" y="88" width="202" height="104" rx="12" fill="#203c3e" stroke="#4d7c78"/><text x="49" y="127" font-size="25" fill="#83d8cd" font-weight="650" >Data</text><text x="49" y="161" font-size="18" fill="#b0cbc7" font-weight="400" >Validate splits</text><path d="M241 140 H259 m-5 -5 l5 5 -5 5" fill="none" stroke="#92b7b1" stroke-width="2"/><rect x="267" y="88" width="202" height="104" rx="12" fill="#203c3e" stroke="#4d7c78"/><text x="284" y="127" font-size="25" fill="#83d8cd" font-weight="650" >Train</text><text x="284" y="161" font-size="18" fill="#b0cbc7" font-weight="400" >Fit a readout</text><path d="M476 140 H494 m-5 -5 l5 5 -5 5" fill="none" stroke="#92b7b1" stroke-width="2"/><rect x="502" y="88" width="202" height="104" rx="12" fill="#203c3e" stroke="#4d7c78"/><text x="519" y="127" font-size="25" fill="#83d8cd" font-weight="650" >Calibrate</text><text x="519" y="161" font-size="18" fill="#b0cbc7" font-weight="400" >Fit temperature</text><path d="M711 140 H729 m-5 -5 l5 5 -5 5" fill="none" stroke="#92b7b1" stroke-width="2"/><rect x="737" y="88" width="202" height="104" rx="12" fill="#203c3e" stroke="#4d7c78"/><text x="754" y="127" font-size="25" fill="#83d8cd" font-weight="650" >Evaluate</text><text x="754" y="161" font-size="18" fill="#b0cbc7" font-weight="400" >Compare results</text><path d="M946 140 H964 m-5 -5 l5 5 -5 5" fill="none" stroke="#92b7b1" stroke-width="2"/><rect x="972" y="88" width="202" height="104" rx="12" fill="#203c3e" stroke="#4d7c78"/><text x="989" y="127" font-size="25" fill="#83d8cd" font-weight="650" >Serve</text><text x="989" y="161" font-size="18" fill="#b0cbc7" font-weight="400" >Load &amp; answer</text><text x="32" y="242" font-size="16" fill="#83d8cd" font-weight="650" >Recorded along the way</text><text x="270" y="242" font-size="16" fill="#e2eaf3" font-weight="400" >Configuration · data version · model identity · metrics</text></svg>
