<svg xmlns="http://www.w3.org/2000/svg" width="950" height="433" viewBox="0 0 950 433" role="img" aria-labelledby="title"><title id="title">向判断模型提出四类问题</title><style>text {font-family: "Inter", "DejaVu Sans", Arial, sans-serif}</style><rect width="950" height="433" rx="18" fill="#FAF9F5"/><style>text.heading {font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif} text.kind {font-family: ui-monospace, "SFMono-Regular", Consolas, monospace}</style><text x="22" y="40" font-size="28" fill="#24231F" font-weight="500" class="heading">向判断模型提出四类问题</text><text x="24" y="84" font-size="16" fill="#625F56" font-weight="600" >判断类型</text><text x="262" y="84" font-size="16" fill="#625F56" font-weight="600" >问题</text><text x="595" y="84" font-size="16" fill="#625F56" font-weight="600" >构造输出示例</text><path d="M22 99 H928" stroke="#C4BEB1"/><text x="24" y="128" font-size="20" fill="#24231F" font-weight="600" >是非判断</text><text x="24" y="153" font-size="15" fill="#924428" font-weight="400" text-anchor="start" class="kind">noul</text><text x="262" y="140" font-size="17" fill="#625F56" font-weight="400" >需要人工处理吗？</text><text x="595" y="140" font-size="18" fill="#375A75" font-weight="550" >P(是) = 0.85</text><path d="M22 171 H928" stroke="#C4BEB1"/><text x="24" y="200" font-size="20" fill="#24231F" font-weight="600" >选择判断</text><text x="24" y="225" font-size="15" fill="#924428" font-weight="400" text-anchor="start" class="kind">choice</text><text x="262" y="212" font-size="17" fill="#625F56" font-weight="400" >应该交给哪个团队？</text><text x="595" y="212" font-size="18" fill="#375A75" font-weight="550" >账单 0.70 · 支持 0.30</text><path d="M22 243 H928" stroke="#C4BEB1"/><text x="24" y="272" font-size="20" fill="#24231F" font-weight="600" >等级判断</text><text x="24" y="297" font-size="15" fill="#924428" font-weight="400" text-anchor="start" class="kind">score</text><text x="262" y="284" font-size="17" fill="#625F56" font-weight="400" >请求的紧急程度是几级？</text><text x="595" y="284" font-size="18" fill="#375A75" font-weight="550" >P(等级 1), …, P(等级 5)</text><path d="M22 315 H928" stroke="#C4BEB1"/><text x="24" y="344" font-size="20" fill="#24231F" font-weight="600" >多标签判断</text><text x="24" y="369" font-size="15" fill="#924428" font-weight="400" text-anchor="start" class="kind">multi_label</text><text x="262" y="356" font-size="17" fill="#625F56" font-weight="400" >包含哪些主题？</text><text x="595" y="356" font-size="18" fill="#375A75" font-weight="550" >P(支付), P(卡片), …</text><text x="24" y="413" font-size="16" fill="#625F56" font-weight="400" >示例用于说明各类型的概率含义。</text></svg>
